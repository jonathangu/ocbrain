name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Golden Shared Context contract
        run: python -m pytest -q tests/test_golden_context_v1.py
      - name: Test
        run: python -m pytest -q
      - name: Lint
        run: ruff check .
      - name: Compile
        run: python -m compileall -q src tests
      - name: Public-safety scan
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base_commit="${{ github.event.pull_request.base.sha }}"
            head_commit="${{ github.event.pull_request.head.sha }}"
          else
            base_commit="${{ github.event.before }}"
            head_commit="$GITHUB_SHA"
          fi
          if [[ -z "$base_commit" || "$base_commit" =~ ^0+$ || -z "$head_commit" ]]; then
            echo "public-safety: a real base/head diff range is required in CI" >&2
            exit 1
          fi
          git cat-file -e "${base_commit}^{commit}"
          git cat-file -e "${head_commit}^{commit}"
          ocbrain public-safety-check --root "$GITHUB_WORKSPACE" \
            --diff-range "${base_commit}..${head_commit}"
