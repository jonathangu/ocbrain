[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ocbrain"
version = "1.1.0"
description = "Local, source-backed Shared Context for Codex, Claude Code, and MCP clients"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Jonathan Gu" }]
dependencies = []
keywords = ["agents", "memory", "mcp", "sqlite"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://openclawbrain.ai/"
Documentation = "https://openclawbrain.ai/install/"
Repository = "https://github.com/jonathangu/ocbrain"
Issues = "https://github.com/jonathangu/ocbrain/issues"
Changelog = "https://github.com/jonathangu/ocbrain/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]
# The wiki curator's Anthropic backend. Kept out of the core dependency set so
# `pip install ocbrain` stays dependency-free; the import is lazy, so the module
# is usable (and testable) without this extra installed.
curator = [
  "anthropic>=0.70",
]
# The optional cross-encoder rerank stage. Out of the core dependency set
# because it pulls in torch; the import is lazy, so retrieval works without it.
rerank = [
  "sentence-transformers>=3.0",
]

[project.scripts]
ocbrain = "ocbrain.cli:main"
ocbrain-closeout = "ocbrain.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/ocbrain"]

[tool.hatch.build]
# Hatch's source archive may otherwise include untracked worktree files. Keep
# every private/runtime surface out explicitly; .gitignore is defense in depth,
# not the package boundary.
exclude = [
  "/data/**",
  "/logs/**",
  "/dist/**",
  "/.venv/**",
  "/.pytest_cache/**",
  "/.ruff_cache/**",
  "/uv.lock",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
# Gate, not aspiration: every category here is at zero across production code,
# so a new finding is a regression rather than pre-existing debt. C90 (mccabe)
# and S (bandit) are deliberately out — both carry a large standing count that
# is not incrementally fixable, and a gate nobody can pass is a gate people
# learn to skip. scripts/code-quality.sh reports those, plus complexity,
# duplication, and slop patterns, as advice.
select = ["E", "F", "I", "UP", "B", "C4", "RET", "PIE"]
